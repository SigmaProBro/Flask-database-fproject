{% extends "base.html" %}

{% block content %}
<h1>Мої бронювання</h1>

{% for booking in bookings %}
    <p>Місце: {{ booking.place }}</p>
    <p>Дата: {{ booking.booking_time }}</p>
    <p>Людей: {{ booking.people_count }}</p>

    <a href="{{ url_for('edit_booking', booking_id=booking.id) }}">
        Редагувати
    </a>
    <hr>
{% else %}
    <p>Бронювань немає.</p>
{% endfor %}

{% endblock %}
